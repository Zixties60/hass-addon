name: Home Dashboard
version: "0.2.3"
slug: home_dashboard
description: Read-only dashboard for energy, solar, climate and entity history stored in InfluxDB
url: https://github.com/Zixties60/hass-addon/tree/main/home_dashboard
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power-variant
panel_title: Home Dashboard
# Read-only use of the Core API: entity names, areas and Energy dashboard preferences.
homeassistant_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direct access without Home Assistant login (leave disabled unless you need it)
# Defaults point at the official InfluxDB add-on (Home Assistant Community Apps, InfluxDB 1.x).
options:
  influx_version: auto
  influx_url: "http://a0d7b954-influxdb:8086"
  influx_database: homeassistant
  influx_username: ""
  influx_password: ""
  influx_token: ""
  influx_org: homeassistant
  influx_bucket: homeassistant
  allow_settings_edit: true
  entity_lookback_days: 30
schema:
  influx_version: list(auto|1|2)
  influx_url: url
  influx_database: str
  influx_username: str?
  influx_password: password?
  influx_token: password?
  influx_org: str
  influx_bucket: str
  allow_settings_edit: bool
  entity_lookback_days: int(1,365)
